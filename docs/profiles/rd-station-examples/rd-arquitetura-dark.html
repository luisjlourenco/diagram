<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecossistema RD Station · Arquitetura</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #001927;
      --color-ink:     #f5f7f8;
      --color-muted:   #b2bcc1;
      --color-accent:  #00dbff;
      --font-sans:     'DM Sans', system-ui, sans-serif;
      --font-serif:    'DM Sans', system-ui, sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitetura · RD Station</p>
    <h1>Jornada do lead no ecossistema RD Station</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">Jornada do lead no ecossistema RD Station</title>
      <desc id="architecture-desc">Diagrama de arquitetura: o lead visita uma landing page, converte no RD Station Marketing, que qualifica e envia oportunidades ao RD Station CRM e fluxos de atendimento ao RD Conversas.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(245,247,248,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b2bcc1"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00dbff"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b570ff"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#001927"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Zone: Content services (drawn before arrows and nodes) -->
        <rect x="616" y="128" width="164" height="272" rx="8"
              fill="rgba(245,247,248,0.03)" stroke="rgba(245,247,248,0.10)" stroke-width="0.8"/>
        <rect x="672" y="132" width="52" height="12" rx="2" fill="#001927"/>
        <text x="698" y="141" fill="rgba(245,247,248,0.35)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">VENDAS</text>

        <!-- Arrows first (behind boxes) -->
        <line x1="168" y1="272" x2="220" y2="272" stroke="#b570ff" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="364" y1="272" x2="416" y2="272" stroke="#00dbff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 576,260 H 692 Q 700,260 700,252 V 224"
              fill="none" stroke="#b2bcc1" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 576,284 H 692 Q 700,284 700,292 V 320"
              fill="none" stroke="#b2bcc1" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Dashed return: Cloudflare→Reader (cached HTML) -->
        <path d="M 220,288 H 168" fill="none" stroke="#b2bcc1" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="172" y="252" width="48" height="12" rx="2" fill="#001927"/>
        <text x="196" y="262" fill="#b570ff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VISITA</text>

        <rect x="172" y="278" width="32" height="12" rx="2" fill="#001927"/>
        <text x="188" y="287" fill="#b2bcc1" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COOKIE</text>

        <rect x="368" y="252" width="48" height="12" rx="2" fill="#001927"/>
        <text x="392" y="262" fill="#00dbff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LEAD</text>

        <rect x="632" y="240" width="60" height="12" rx="2" fill="#001927"/>
        <text x="662" y="249" fill="#b2bcc1" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MQL</text>

        <rect x="632" y="292" width="44" height="12" rx="2" fill="#001927"/>
        <text x="654" y="301" fill="#b2bcc1" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FLUXO</text>

        <!-- Node: Reader -->
        <rect x="40" y="240" width="128" height="64" rx="6" fill="#001927"/>
        <rect x="40" y="240" width="128" height="64" rx="6" fill="rgba(178,188,193,0.10)" stroke="#8c9ba3" stroke-width="1"/>
        <rect x="48" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(140,155,163,0.40)" stroke-width="0.8"/>
        <text x="62" y="257" fill="#8c9ba3" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="104" y="276" fill="#f5f7f8" font-size="12" font-weight="700" font-family="'DM Sans', sans-serif" text-anchor="middle">Lead</text>
        <text x="104" y="292" fill="#b2bcc1" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">navegador · mobile</text>

        <!-- Node: Cloudflare -->
        <rect x="220" y="240" width="144" height="64" rx="6" fill="#001927"/>
        <rect x="220" y="240" width="144" height="64" rx="6" fill="rgba(245,247,248,0.03)" stroke="rgba(245,247,248,0.30)" stroke-width="1"/>
        <rect x="228" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,247,248,0.22)" stroke-width="0.8"/>
        <text x="244" y="257" fill="#8c9ba3" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LP</text>
        <text x="356" y="300" fill="rgba(245,247,248,0.06)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
        <text x="292" y="276" fill="#f5f7f8" font-size="12" font-weight="700" font-family="'DM Sans', sans-serif" text-anchor="middle">Landing Page</text>
        <text x="292" y="292" fill="#b2bcc1" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">form · utm</text>

        <!-- Node: Astro (focal coral) -->
        <rect x="416" y="240" width="160" height="64" rx="6" fill="#001927"/>
        <rect x="416" y="240" width="160" height="64" rx="6" fill="rgba(0,219,255,0.12)" stroke="#00dbff" stroke-width="1"/>
        <rect x="424" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(0,219,255,0.50)" stroke-width="0.8"/>
        <text x="440" y="257" fill="#00dbff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MKT</text>
        <text x="568" y="300" fill="rgba(0,219,255,0.10)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
        <text x="496" y="276" fill="#f5f7f8" font-size="12" font-weight="700" font-family="'DM Sans', sans-serif" text-anchor="middle">RD Station Marketing</text>
        <text x="496" y="292" fill="#b2bcc1" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">automação · lead scoring</text>

        <!-- Node: MDX Bundle -->
        <rect x="628" y="160" width="144" height="64" rx="6" fill="#001927"/>
        <rect x="628" y="160" width="144" height="64" rx="6" fill="#0b2a3b" stroke="#f5f7f8" stroke-width="1"/>
        <rect x="636" y="168" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,247,248,0.40)" stroke-width="0.8"/>
        <text x="652" y="177" fill="#f5f7f8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRM</text>
        <text x="700" y="196" fill="#f5f7f8" font-size="12" font-weight="700" font-family="'DM Sans', sans-serif" text-anchor="middle">RD Station CRM</text>
        <text x="700" y="212" fill="#b2bcc1" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">funil · oportunidades</text>

        <!-- Node: Content CMS -->
        <rect x="628" y="320" width="144" height="64" rx="6" fill="#001927"/>
        <rect x="628" y="320" width="144" height="64" rx="6" fill="rgba(245,247,248,0.05)" stroke="#b2bcc1" stroke-width="1"/>
        <rect x="636" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(178,188,193,0.50)" stroke-width="0.8"/>
        <text x="650" y="337" fill="#b2bcc1" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHAT</text>
        <text x="700" y="356" fill="#f5f7f8" font-size="12" font-weight="700" font-family="'DM Sans', sans-serif" text-anchor="middle">RD Conversas</text>
        <text x="700" y="372" fill="#b2bcc1" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">whatsapp · chatbot</text>

        <!-- Legend strip -->
        <line x1="40" y1="404" x2="960" y2="404" stroke="rgba(245,247,248,0.10)" stroke-width="0.8"/>
        <text x="40" y="420" fill="#b2bcc1" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGENDA</text>

        <rect x="40" y="436" width="14" height="10" rx="2" fill="rgba(0,219,255,0.12)" stroke="#00dbff" stroke-width="1"/>
        <text x="60" y="444" fill="#b2bcc1" font-size="8.5" font-family="'DM Sans', sans-serif">Foco / núcleo</text>

        <rect x="180" y="436" width="14" height="10" rx="2" fill="#0b2a3b" stroke="#f5f7f8" stroke-width="1"/>
        <text x="200" y="444" fill="#b2bcc1" font-size="8.5" font-family="'DM Sans', sans-serif">Produto RD</text>

        <rect x="340" y="436" width="14" height="10" rx="2" fill="rgba(245,247,248,0.05)" stroke="#b2bcc1" stroke-width="1"/>
        <text x="360" y="444" fill="#b2bcc1" font-size="8.5" font-family="'DM Sans', sans-serif">Canal</text>

        <rect x="436" y="436" width="14" height="10" rx="2" fill="rgba(245,247,248,0.03)" stroke="rgba(245,247,248,0.30)" stroke-width="1"/>
        <text x="456" y="444" fill="#b2bcc1" font-size="8.5" font-family="'DM Sans', sans-serif">Entrada</text>

        <rect x="528" y="436" width="14" height="10" rx="2" fill="rgba(178,188,193,0.10)" stroke="#8c9ba3" stroke-width="1"/>
        <text x="548" y="444" fill="#b2bcc1" font-size="8.5" font-family="'DM Sans', sans-serif">Externo</text>

        <line x1="636" y1="442" x2="664" y2="442" stroke="#b570ff" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="672" y="444" fill="#b2bcc1" font-size="8.5" font-family="'DM Sans', sans-serif">Requisição HTTP</text>

        <line x1="784" y1="442" x2="812" y2="442" stroke="#00dbff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="820" y="444" fill="#b2bcc1" font-size="8.5" font-family="'DM Sans', sans-serif">Fluxo principal</text>

        <line x1="900" y1="442" x2="928" y2="442" stroke="#b2bcc1" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="936" y="444" fill="#b2bcc1" font-size="8.5" font-family="'DM Sans', sans-serif">Retorno</text>
      </svg>
  </div>
</body>
</html>
